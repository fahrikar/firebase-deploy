name: Firebase Rules Drift Check (reusable)

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      fail_on_drift:
        description: "true ise fark bulununca workflow kirmizi olur"
        required: false
        default: true
        type: boolean
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true

permissions:
  contents: read

jobs:
  drift:
    name: Kural farki kontrolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google kimlik dogrulama
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Canli kurallari cek ve karsilastir
        working-directory: ${{ inputs.working_directory }}
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          DRIFT=0

          check_rules () {
            RELEASE="$1"
            LOCAL_FILE="$2"
            LABEL="$3"

            if [ ! -f "$LOCAL_FILE" ]; then
              echo "$LABEL: repoda dosya yok, atlaniyor."
              return 0
            fi

            REL=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://firebaserules.googleapis.com/v1/projects/$PROJECT/releases/$RELEASE")

            RULESET=$(echo "$REL" | jq -r '.rulesetName // empty')
            if [ -z "$RULESET" ]; then
              echo "::warning::$LABEL - canli ruleset okunamadi (yayinlanmamis olabilir)."
              return 0
            fi

            curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://firebaserules.googleapis.com/v1/$RULESET" \
              | jq -r '.source.files[0].content' > /tmp/live.rules

            if diff -q -B -w <(sed -e 's/[[:space:]]*$//' "$LOCAL_FILE") \
                             <(sed -e 's/[[:space:]]*$//' /tmp/live.rules) >/dev/null; then
              echo "$LABEL: repo ile Console ayni."
            else
              echo "::warning::$LABEL - Console ile repo FARKLI!"
              {
                echo "### $LABEL farki bulundu"
                echo ""
                echo "Console'da elle degisiklik yapilmis olabilir. Repo tek dogru kaynaktir."
                echo ""
                echo '```diff'
                diff -u "$LOCAL_FILE" /tmp/live.rules | head -80 || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              DRIFT=1
            fi
          }

          check_rules "cloud.firestore"  "firestore.rules" "Firestore Rules"
          check_rules "firebase.storage" "storage.rules"   "Storage Rules"

          if [ "$DRIFT" -eq 1 ] && [ "${{ inputs.fail_on_drift }}" = "true" ]; then
            echo "::error::Console ile repo arasinda kural farki var."
            exit 1
          fi
